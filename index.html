<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>اختبر نفسك | الدرس الخامس: الملفات الرقمية</title>
<style>
  :root{
    --navy:#173D73;
    --navy-deep:#0E2A54;
    --gold:#F2A71B;
    --gold-deep:#D98C0A;
    --violet:#3D3A8F;
    --paper:#FBF7EE;
    --paper-2:#FFFFFF;
    --ink:#182338;
    --ink-soft:#4B5670;
    --line:#E4DCC8;
    --good:#1E8E5A;
    --good-bg:#E4F7EC;
    --bad:#C13B3B;
    --bad-bg:#FBE7E5;
    --radius-card: 22px;
    --radius-pill: 999px;
    --shadow-soft: 0 14px 30px -12px rgba(23,61,115,.28);
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  :root:not([data-theme="light"]) {
    @media (prefers-color-scheme: dark) {
      --paper:#0F1626;
      --paper-2:#161F33;
      --ink:#F1F0E8;
      --ink-soft:#B9C2D6;
      --line:#293754;
    }
  }
  :root[data-theme="dark"]{
    --paper:#0F1626;
    --paper-2:#161F33;
    --ink:#F1F0E8;
    --ink-soft:#B9C2D6;
    --line:#293754;
  }
  html{ scroll-padding-top: env(safe-area-inset-top, 0px); height:100%; box-sizing:border-box;}
  *,*::before,*::after{ box-sizing:inherit; }
  body{
    margin:0; min-height:100%;
    font-family:"Tahoma","Segoe UI",-apple-system,BlinkMacSystemFont,sans-serif;
    background:var(--paper);
    color:var(--ink);
    background-image:
      radial-gradient(circle at 8% 12%, rgba(242,167,27,.14), transparent 40%),
      radial-gradient(circle at 92% 82%, rgba(61,58,143,.14), transparent 45%);
    overflow-x:hidden;
  }
  .app{ max-width:720px; margin:0 auto; padding:22px 18px 48px; min-height:100vh; display:flex; flex-direction:column; }

  /* ---------- header ---------- */
  .brand{ display:flex; align-items:center; justify-content:center; gap:12px; margin-bottom:6px; }
  .brand img{ height:54px; width:auto; filter:drop-shadow(0 6px 14px rgba(23,61,115,.25)); }
  .lesson-tag{
    text-align:center; color:var(--ink-soft); font-size:.95rem; margin:2px 0 22px;
  }
  .lesson-tag b{ color:var(--navy); }
  :root[data-theme="dark"] .lesson-tag b{ color:var(--gold); }

  /* ---------- generic panel ---------- */
  .panel{
    background:var(--paper-2);
    border:1px solid var(--line);
    border-radius:var(--radius-card);
    box-shadow:var(--shadow-soft);
    padding:28px 24px;
    position:relative;
    overflow:hidden;
  }
  .panel::before{
    content:""; position:absolute; inset:0 0 auto 0; height:6px;
    background:linear-gradient(90deg,var(--gold),var(--navy) 55%,var(--violet));
  }

  h1.title{
    font-size:1.5rem; line-height:1.35; margin:6px 0 4px; color:var(--navy); text-align:center;
  }
  :root[data-theme="dark"] h1.title{ color:var(--gold); }
  p.sub{ text-align:center; color:var(--ink-soft); margin:0 0 20px; font-size:.98rem; }

  /* ---------- folder art on intro ---------- */
  .folder-scene{
    display:flex; justify-content:center; align-items:flex-end; gap:14px; margin:10px 0 22px; height:74px;
  }
  .folder-scene .f{
    width:52px; height:40px; border-radius:6px 10px 10px 10px; position:relative;
    animation: bob 2.6s ease-in-out infinite;
  }
  .folder-scene .f::before{
    content:""; position:absolute; top:-10px; right:6px; width:26px; height:12px;
    border-radius:6px 6px 0 0; background:inherit;
  }
  .folder-scene .f1{ background:var(--gold); animation-delay:0s;}
  .folder-scene .f2{ background:var(--navy); height:52px; animation-delay:.25s;}
  .folder-scene .f3{ background:var(--violet); animation-delay:.5s;}
  @keyframes bob{ 0%,100%{ transform:translateY(0);} 50%{ transform:translateY(-8px);} }

  input[type=text]{
    width:100%; padding:14px 16px; font-size:1.05rem; border-radius:14px;
    border:2px solid var(--line); background:var(--paper); color:var(--ink);
    text-align:center; outline:none; transition:border-color .15s ease;
    font-family:inherit;
  }
  input[type=text]:focus{ border-color:var(--gold-deep); }

  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    border:none; cursor:pointer; font-family:inherit; font-weight:700; font-size:1.02rem;
    padding:14px 26px; border-radius:var(--radius-pill); transition:transform .12s ease, box-shadow .12s ease;
  }
  .btn:active{ transform:scale(.97); }
  .btn:focus-visible{ outline:3px solid var(--gold-deep); outline-offset:2px; }
  .btn-primary{ background:linear-gradient(135deg,var(--gold),var(--gold-deep)); color:#3A2500; box-shadow:0 10px 22px -8px rgba(217,140,10,.55); width:100%; margin-top:18px;}
  .btn-primary:disabled{ opacity:.5; cursor:not-allowed; box-shadow:none; }
  .btn-ghost{ background:transparent; border:2px solid var(--navy); color:var(--navy); }
  :root[data-theme="dark"] .btn-ghost{ border-color:var(--gold); color:var(--gold); }
  .btn-wa{ background:#25D366; color:#fff; width:100%; margin-top:14px; box-shadow:0 10px 22px -8px rgba(37,211,102,.55);}

  /* ---------- quiz screen ---------- */
  .hidden{ display:none !important; }
  .progress-wrap{ display:flex; align-items:center; gap:10px; margin-bottom:16px; }
  .progress-track{ flex:1; height:10px; border-radius:999px; background:var(--line); overflow:hidden; }
  .progress-fill{ height:100%; background:linear-gradient(90deg,var(--gold),var(--navy)); width:0%; transition:width .35s ease; border-radius:999px; }
  .progress-label{ font-size:.85rem; color:var(--ink-soft); white-space:nowrap; font-variant-numeric:tabular-nums; }

  .section-chip{
    display:inline-block; background:var(--navy); color:#fff; font-size:.8rem; font-weight:700;
    padding:6px 14px; border-radius:999px; margin-bottom:14px;
  }
  :root[data-theme="dark"] .section-chip{ background:var(--gold); color:#3A2500; }

  .q-text{ font-size:1.18rem; line-height:1.6; margin:0 0 20px; color:var(--ink); font-weight:700; }

  .options{ display:flex; flex-direction:column; gap:12px; }
  .opt{
    display:flex; align-items:center; gap:12px; text-align:right;
    padding:14px 16px; border-radius:16px; border:2px solid var(--line);
    background:var(--paper); color:var(--ink); font-size:1.02rem; cursor:pointer;
    font-family:inherit; width:100%; transition:border-color .12s ease, background .12s ease, transform .1s ease;
  }
  .opt:hover:not(:disabled){ border-color:var(--gold-deep); transform:translateY(-1px); }
  .opt .letter{
    flex:0 0 auto; width:30px; height:30px; border-radius:50%; background:var(--navy); color:#fff;
    display:flex; align-items:center; justify-content:center; font-size:.85rem; font-weight:700;
  }
  :root[data-theme="dark"] .opt .letter{ background:var(--gold); color:#3A2500; }
  .opt.correct{ background:var(--good-bg); border-color:var(--good); }
  .opt.correct .letter{ background:var(--good); color:#fff; }
  .opt.wrong{ background:var(--bad-bg); border-color:var(--bad); }
  .opt.wrong .letter{ background:var(--bad); color:#fff; }
  .opt:disabled{ cursor:default; }

  .feedback{
    margin-top:18px; padding:14px 16px; border-radius:16px; font-weight:700; font-size:1.05rem;
    display:flex; align-items:center; gap:10px; opacity:0; transform:translateY(6px);
    transition:opacity .2s ease, transform .2s ease;
  }
  .feedback.show{ opacity:1; transform:translateY(0); }
  .feedback.good{ background:var(--good-bg); color:var(--good); }
  .feedback.bad{ background:var(--bad-bg); color:var(--bad); }
  .feedback .emoji{ font-size:1.6rem; }

  .next-row{ margin-top:18px; display:flex; justify-content:flex-end; }
  .next-row .btn{ padding:12px 24px; }

  /* ---------- reflection ---------- */
  .reflect-card{ border:2px dashed var(--line); border-radius:18px; padding:18px; margin-bottom:16px; }
  .reflect-q{ font-weight:700; margin:0 0 10px; }
  .reflect-ans{
    background:var(--paper); border-radius:12px; padding:12px 14px; color:var(--ink-soft);
    display:none; margin-top:10px; border-right:4px solid var(--gold-deep);
  }
  .reflect-ans.show{ display:block; }
  .reveal-btn{ background:var(--violet); color:#fff; padding:9px 18px; font-size:.9rem; }

  /* ---------- results ---------- */
  .score-badge{
    width:150px; height:150px; border-radius:50%; margin:6px auto 18px; display:flex; flex-direction:column;
    align-items:center; justify-content:center; background:conic-gradient(var(--gold) calc(var(--pct,0)*1%), var(--line) 0);
    position:relative;
  }
  .score-badge::after{
    content:""; position:absolute; inset:10px; border-radius:50%; background:var(--paper-2);
  }
  .score-badge .num{ position:relative; font-size:1.9rem; font-weight:800; color:var(--navy); }
  .score-badge .lbl{ position:relative; font-size:.8rem; color:var(--ink-soft); }
  :root[data-theme="dark"] .score-badge .num{ color:var(--gold); }
  .result-emoji{ font-size:3rem; text-align:center; margin-bottom:6px; }
  .result-msg{ text-align:center; font-size:1.15rem; font-weight:700; color:var(--navy); margin-bottom:4px; }
  :root[data-theme="dark"] .result-msg{ color:var(--gold); }
  .result-name{ text-align:center; color:var(--ink-soft); margin-bottom:22px; }

  .confetti-layer{ position:fixed; inset:0; pointer-events:none; z-index:50; overflow:hidden; }
  .confetti-piece{ position:absolute; top:-20px; border-radius:2px; }

  @media (max-width:420px){
    .panel{ padding:22px 16px; }
    h1.title{ font-size:1.28rem; }
    .score-badge{ width:130px; height:130px; }
  }
</style>
</head>

  ];

  var WHATSAPP_NUMBER = "201099920517";

  /* ---------------- STATE ---------------- */
  var studentName = "";

  /* ---------------- AUDIO (Web Audio API, no external files) ---------------- */
  var audioCtx = null;
  function ctx(){
    if(!audioCtx){
      try{ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ audioCtx = null; }
    }
    return audioCtx;
  }
  function tone(freq, start, dur, type, gain){
    var c = ctx(); if(!c) return;
    var osc = c.createOscillator();
    var g = c.createGain();
    osc.type = type || "sine";
    osc.frequency.value = freq;
    g.gain.value = gain || 0.08;
    osc.connect(g); g.connect(c.destination);
    osc.start(c.currentTime + start);
    g.gain.setValueAtTime(g.gain.value, c.currentTime + start + dur*0.6);
    g.gain.linearRampToValueAtTime(0.0001, c.currentTime + start + dur);
    osc.stop(c.currentTime + start + dur + 0.02);
  }
  function playCorrect(){
    try{
      tone(523.25,0,.14,"sine",.09);
      tone(659.25,.12,.14,"sine",.09);
      tone(783.99,.24,.22,"sine",.09);
    }catch(e){}
  }
  function playWrong(){
    try{
      tone(220,0,.18,"sawtooth",.07);
      tone(174.6,.16,.26,"sawtooth",.07);
    }catch(e){}
  }
  function playFanfare(){
    try{
      [523.25,659.25,783.99,1046.5].forEach(function(f,i){ tone(f, i*.13, .22, "triangle", .09); });
    }catch(e){}
  }

  /* ---------------- CONFETTI ---------------- */
  function burstConfetti(count){
    var layer = document.createElement("div");
    layer.className = "confetti-layer";
    document.body.appendChild(layer);
    var colors = ["#F2A71B","#173D73","#3D3A8F","#1E8E5A","#D98C0A"];
    for(var i=0;i<count;i++){
      var p = document.createElement("div");
      p.className = "confetti-piece";
      var size = 6 + Math.random()*6;
      p.style.width = size+"px";
      p.style.height = (size*1.4)+"px";
      p.style.left = (Math.random()*100)+"vw";
      p.style.background = colors[Math.floor(Math.random()*colors.length)];
      p.style.transform = "rotate("+Math.floor(Math.random()*360)+"deg)";
      var duration = 1.4 + Math.random()*1.2;
      var drift = (Math.random()*140-70);
      p.animate([
        { transform: p.style.transform + " translate(0,0)", opacity:1 },
        { transform: "rotate("+(Math.random()*720)+"deg) translate("+drift+"px, 100vh)", opacity:0.9 }
      ], { duration: duration*1000, easing:"cubic-bezier(.25,.6,.4,1)" });
      layer.appendChild(p);
    }
    setTimeout(function(){ layer.remove(); }, 2800);
  }

  /* ---------------- FLOW ---------------- */
  el.name.addEventListener("input", function(){
    el.startBtn.disabled = el.name.value.trim().length === 0;
  });

  el.startBtn.addEventListener("click", function(){
    studentName = el.name.value.trim();
    if(!studentName) return;
    el.screenIntro.classList.add("hidden");
    el.screenQuiz.classList.remove("hidden");
    current = 0; score = 0;
    renderQuestion();
  });

  function renderQuestion(){
    answered = false;
    var q = QUESTIONS[current];
    el.progressLabel.textContent = (current+1) + " / " + QUESTIONS.length;
    el.progressFill.style.width = Math.round(((current)/QUESTIONS.length)*100) + "%";
    el.sectionChip.textContent = q.section;
    el.qText.textContent = q.text;
    el.feedback.classList.remove("show","good","bad");
    el.nextBtn.style.display = "none";

    el.qOptions.innerHTML = "";
    var opts, correctIdx;
    if(q.type === "tf"){
      opts = ["صح ✅","خطأ ❌"];
      correctIdx = q.answer ? 0 : 1;
    } else {
      opts = q.options;
      correctIdx = q.correct;
    }

    opts.forEach(function(optText, idx){
      var b = document.createElement("button");
      b.className = "opt";
      b.type = "button";
      var letter = document.createElement("span");
      letter.className = "letter";
      letter.textContent = q.type === "tf" ? (idx+1) : LETTERS[idx];
      var span = document.createElement("span");
      span.textContent = optText;
      b.appendChild(letter);
      b.appendChild(span);
      b.addEventListener("click", function(){ handleAnswer(idx, correctIdx, b); });
      el.qOptions.appendChild(b);
    });
  }

  function handleAnswer(chosenIdx, correctIdx, btnEl){
    if(answered) return;
    answered = true;
    var isCorrect = chosenIdx === correctIdx;
    var buttons = el.qOptions.querySelectorAll(".opt");
    buttons.forEach(function(b, i){
      b.disabled = true;
      if(i === correctIdx) b.classList.add("correct");
      if(i === chosenIdx && !isCorrect) b.classList.add("wrong");
    });

    el.feedback.classList.add("show");
    if(isCorrect){
      score++;
      el.feedback.classList.add("good");
      el.feedbackEmoji.textContent = "😄";
      var goodMsgs = ["أحسنت! إجابة صحيحة","رائع! أنت محترف 👏","ممتاز، استمر هكذا","صح تمامًا! 🎉"];
      el.feedbackText.textContent = goodMsgs[Math.floor(Math.random()*goodMsgs.length)];
      playCorrect();
      burstConfetti(16);
    } else {
      el.feedback.classList.add("bad");
      el.feedbackEmoji.textContent = "😢";
      el.feedbackText.textContent = "إجابة غير صحيحة، حاول تتذكر الدرس في المرة القادمة";
      playWrong();
    }
    el.nextBtn.style.display = "inline-flex";
    el.progressFill.style.width = Math.round(((current+1)/QUESTIONS.length)*100) + "%";
  }

  el.nextBtn.addEventListener("click", function(){
    current++;
    if(current < QUESTIONS.length){
      renderQuestion();
    } else {
      el.screenQuiz.classList.add("hidden");
      renderReflect();
      el.screenReflect.classList.remove("hidden");
    }
  });

  function renderReflect(){
    el.reflectList.innerHTML = "";
    REFLECT.forEach(function(item, idx){
      var card = document.createElement("div");
      card.className = "reflect-card";
      var qp = document.createElement("p");
      qp.className = "reflect-q";
      qp.textContent = (idx+1) + ") " + item.q;
      var btn = document.createElement("button");
      btn.className = "btn reveal-btn";
      btn.type = "button";
      btn.textContent = "إظهار الإجابة النموذجية 💡";
      var ans = document.createElement("div");
      ans.className = "reflect-ans";
      ans.textContent = item.a;
      btn.addEventListener("click", function(){
        ans.classList.toggle("show");
        btn.textContent = ans.classList.contains("show") ? "إخفاء الإجابة" : "إظهار الإجابة النموذجية 💡";
      });
      card.appendChild(qp);
      card.appendChild(btn);
      card.appendChild(ans);
      el.reflectList.appendChild(card);
    });
  }

  el.toResultsBtn.addEventListener("click", function(){
    el.screenReflect.classList.add("hidden");
    showResults();
  });

  function showResults(){
    var total = QUESTIONS.length;
    var pct = Math.round((score/total)*100);
    el.scoreBadge.style.setProperty("--pct", pct);
    el.scoreNum.textContent = score + "/" + total;
    el.resultName.textContent = "الطالب/ة: " + studentName;

    var emoji, msg;
    if(pct >= 90){ emoji = "🏆"; msg = "أداء رائع ومتميز! أنت محترف حقيقي"; }
    else if(pct >= 70){ emoji = "🌟"; msg = "أحسنت! نتيجة جيدة جدًا"; }
    else if(pct >= 50){ emoji = "🙂"; msg = "جيد، راجع الدرس لتتحسن أكثر"; }
    else { emoji = "💪"; msg = "لا بأس، حاول مرة أخرى بعد مراجعة الدرس"; }
    el.resultEmoji.textContent = emoji;
    el.resultMsg.textContent = msg;

    el.screenResults.classList.remove("hidden");
    if(pct >= 70){ playFanfare(); burstConfetti(60); }
  }

  el.waBtn.addEventListener("click", function(){
    var total = QUESTIONS.length;
    var pct = Math.round((score/total)*100);
    var msg = "نتيجة اختبار منصة محترف\n" +
      "الدرس الخامس: الملفات الرقمية وكيفية التعامل معها\n" +
      "اسم الطالب/ة: " + studentName + "\n" +

  });
